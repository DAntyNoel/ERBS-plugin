[project]
name = "erbs-plugin"
version = "0.1.0"
description = "Framework-agnostic Eternal Return data, analysis, asset, and card rendering library"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "DAntyNoel" }]
dependencies = [
    "httpx>=0.27.0",
    "platformdirs>=4.2.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
render = [
    "jinja2>=3.1.4",
    "playwright>=1.45.0",
]

[project.scripts]
erbs = "erbs_plugin.cli:main"
erbs-assets = "erbs_plugin.assets.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erbs_plugin"]

[tool.hatch.build]
include = [
    "src/erbs_plugin/**/*.py",
    "src/erbs_plugin/rendering/templates/*.html",
    "src/erbs_plugin/rendering/templates/*.css",
    "src/erbs_plugin/assets/*.svg",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
